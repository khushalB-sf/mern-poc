x-api-env: &api-env
  NODE_ENV: production
  # Inside the compose network the database host is the service name `db`, never localhost.
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  SEED_PASSWORD: ${SEED_PASSWORD:-Passw0rd!demo}
  # First admin: created once, when there is no active admin.
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Loopback only: the database is for local tooling, never for the network.
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5436}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot job: apply migrations, optional demo seed, first admin. The API waits for it to succeed.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *api-env
      SEED_ON_START: ${SEED_ON_START:-false}
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *api-env
      PORT: 4000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # nginx is one proxy in front of the API, so trust one X-Forwarded-For hop. Behind the `tls` profile
      # (Caddy -> nginx -> API) set TRUST_PROXY=2, or every client shares Caddy's address for rate limiting.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Swagger is off unless asked for: set DOCS_ENABLED=true in .env for a local demo.
      DOCS_ENABLED: ${DOCS_ENABLED:-false}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-15000}
      # /metrics answers only with this bearer token; unset means the endpoint is off.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Shared rate-limit store for running more than one API process; blank keeps per-process counters.
      REDIS_URL: ${REDIS_URL:-}
    ports:
      # Loopback only: the browser reaches the API through nginx; direct access bypasses its limits.
      - '127.0.0.1:${API_HOST_PORT:-4000}:4000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_SHOW_DEMO_ACCOUNTS: ${VITE_SHOW_DEMO_ACCOUNTS:-false}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_HOST_PORT:-3000}:8080'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/']
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional TLS terminator: `docker compose --profile tls up -d`. See deploy/Caddyfile.
  caddy:
    profiles: ['tls']
    image: caddy:2
    depends_on:
      web:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - '${HTTP_HOST_PORT:-80}:80'
      - '${HTTPS_HOST_PORT:-443}:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
