services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Loopback only: the database is for local tooling, never for the network.
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5436}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      # Inside the compose network the database host is the service name `db`, never localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_ON_START: ${SEED_ON_START:-false}
      SEED_PASSWORD: ${SEED_PASSWORD:-Passw0rd!demo}
      # nginx is the one proxy in front of the API, so trust exactly one X-Forwarded-For hop.
      TRUST_PROXY: 1
      # Swagger is off unless asked for: set DOCS_ENABLED=true in .env for a local demo.
      DOCS_ENABLED: ${DOCS_ENABLED:-false}
    ports:
      # Loopback only: the browser reaches the API through nginx; direct access bypasses its limits.
      - '127.0.0.1:${API_HOST_PORT:-4000}:4000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_SHOW_DEMO_ACCOUNTS: ${VITE_SHOW_DEMO_ACCOUNTS:-true}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_HOST_PORT:-3000}:8080'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
