server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The browser only talks to this origin. /api is forwarded to the API container by service name,
  # so cookies are first-party (SameSite=Strict works) and no CORS is needed.
  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # Hashed build assets never change: cache them hard.
  location /assets/ {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Single-page app: unknown paths serve index.html and the router takes over. Never cached.
  location / {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
